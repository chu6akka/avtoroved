registry:
  id: authoroved-core-llm-shadow
  version: "0.1.4"
  status: experimental_shadow_not_evidentiary
  language: ru
  notice: >-
    Реестр предназначен только для теневой проверки локальной модели. Кандидаты
    не участвуют в сопоставлении и не имеют экспертной или идентификационной
    значимости до отдельной методической и корпусной валидации.
  identification_thresholds: null
  default_suitability_minimum_words: null

features:
  - id: GRA_101
    name_ru: Постскриптумный маркер интернет-коммуникации
    group: Графические особенности интернет-коммуникации
    automation_mode: LLM_ASSISTED
    definition: Явный маркер добавочного сообщения после основной части текста, включая P.S., PS, постскриптум, З.Ы., ЗЫ и контекстно эквивалентные варианты.
    criteria: [дословно присутствующий маркер, функция добавочного сообщения после основной части]
    exclusions: [случайное сочетание букв внутри слова, цитирование обозначения без функции постскриптума]
    unit: кандидат с дословной цитатой
    normalization: не применяется
    minimum_words: 1
    minimum_volume_status: engineering_only
    evidence_method: одна уникальная дословная цитата; координаты вычисляет Python
    dependency_group: internet_graphics
    method_version: llm-shadow-0.1.0
    sources:
      - {title: "Методика Минюста", locator: "с. 22", role: "общий контекст графических особенностей интернет-коммуникации", verification: "checked_local_primary"}

  - id: GRA_102
    name_ru: Переключение клавиатурной раскладки или клавиатурная транслитерация
    group: Графические особенности интернет-коммуникации
    automation_mode: LLM_ASSISTED
    definition: Осмысленная последовательность, набранная в другой клавиатурной раскладке, включая ЗЫ как клавиатурный аналог PS.
    criteria: [дословно присутствующий фрагмент, интерпретация подтверждается соответствием клавиш русской и латинской раскладки]
    exclusions: [обычное иностранное слово, аббревиатура без признака переключения раскладки, латинские P.S. и PS сами по себе — это постскриптумный маркер GRA_101, а не переключение раскладки]
    unit: кандидат с дословной цитатой
    normalization: не применяется
    minimum_words: 1
    minimum_volume_status: engineering_only
    evidence_method: одна уникальная дословная цитата; координаты вычисляет Python
    dependency_group: internet_graphics
    method_version: llm-shadow-0.1.1
    sources:
      - {title: "Методика Минюста", locator: "с. 22", role: "общий контекст графических особенностей интернет-коммуникации", verification: "checked_local_primary"}

  # Фильтр допуска в теневой реестр. Признак включается только при выполнении всех
  # четырёх условий: (1) дословная локализуемость — каждая реализация выражается одной
  # уникальной дословной подстрокой; (2) выигрыш LLM над паттерн-матчингом — решение
  # требует понимания контекста, иначе признак остаётся AUTO; (3) проверяемое
  # исключающее правило — операциональные exclusions, проверяемые экспертом по цитате;
  # (4) границы компетенции — фиксируется наблюдаемый языковой факт, а не характеристика
  # личности.
  #
  # Отклонённые кандидаты этой итерации:
  # - Эмотивные клише и эмоциональная окраска высказывания: отклонено по условию 4.
  #   Признак описывает приписываемое автору эмоциональное состояние, а не наблюдаемый
  #   языковой факт, и ведёт к суждению о личности. В реестр не вносится.

  - id: GRA_103
    name_ru: Намеренное фонетическое искажение написания
    group: Графические особенности интернет-коммуникации
    automation_mode: LLM_ASSISTED
    definition: Написание слова, намеренно отклонённое от нормативного в сторону звучащей речи — растяжение гласной или согласной, стяжение или редукция, имитирующие произношение, а не орфографию.
    criteria:
      - дословно присутствующий фрагмент
      - отклонение от нормативного написания воспроизводит звучание слова, а не порядок набора
      - "ближайший контекст подтверждает намеренность: имитация интонации, разговорная реплика или диалоговая позиция"
    exclusions:
      - опечатка, перестановка или пропуск букв без читаемой имитации произношения
      - нормативная словарная форма с удвоенной буквой
      - междометие в нормативной словарной записи
      - повтор знака препинания или символа между словами — признак касается только букв внутри слова, а повторы знаков покрывает паттерн-матчинг
      - набор в чужой клавиатурной раскладке — это переключение раскладки GRA_102, а не имитация произношения
      - постскриптумный маркер и его клавиатурный аналог — это GRA_101, а не имитация произношения
      - употребление обычного слова в необычном значении без изменения написания — это лексика LEX_201, а не графика
      - цитирование чужой реплики или разбор искажения как предмета речи
    unit: кандидат с дословной цитатой
    normalization: не применяется
    minimum_words: 1
    minimum_volume_status: engineering_only
    evidence_method: одна уникальная дословная цитата; координаты вычисляет Python
    dependency_group: internet_graphics
    method_version: llm-shadow-0.1.4
    sources:
      - {title: "Методика Минюста", locator: "с. 22", role: "общий контекст графических особенностей интернет-коммуникации", verification: "checked_local_primary"}

  - id: LEX_201
    name_ru: Интернет-сленг с контекстно восстанавливаемой функцией
    group: Лексика интернет-коммуникации
    automation_mode: LLM_ASSISTED
    definition: "Словоформа, употреблённая в интернет-сленговой функции, при которой её нормативное словарное значение не подходит к окружению: подстановка словарного значения на место этой формы делает предложение бессмысленным или грамматически несогласованным."
    criteria:
      - дословно присутствующий фрагмент
      - "проверка подстановкой: нормативное словарное значение формы, подставленное в это же предложение, даёт бессмыслицу или несогласованность"
      - "окружение задаёт иную функцию: подтверждение, оценка, усиление, обращение или отрицание"
      - сленговая функция восстанавливается из самого предложения, без обращения к внешнему списку сленговых слов
      - форма записана нормативно и существует как обычное слово русского языка; искажённое, растянутое или нечитаемое написание признаком не является
    exclusions:
      - форма употреблена в прямом словарном значении, и подстановка этого значения даёт осмысленное предложение
      - термин предметной области в прямом терминологическом значении
      - заимствование или жаргонизм, значение которого задано словарём и не зависит от контекста
      - переносное значение, зафиксированное в нормативном словаре
      - имя собственное, название продукта, никнейм, хештег
      - написание, отклонённое от нормативного растяжением, стяжением или имитацией произношения — это графика GRA_103, а не лексика
      - последовательность букв, набранная в чужой клавиатурной раскладке, — это GRA_102, а не лексика
      - опечатка или случайная перестановка букв
      - повтор знаков препинания и любой фрагмент, не являющийся отдельным словом
      - цитирование или объяснение сленгового слова как предмета речи
    unit: кандидат с дословной цитатой
    normalization: не применяется
    minimum_words: 1
    minimum_volume_status: engineering_only
    evidence_method: одна уникальная дословная цитата; координаты вычисляет Python
    dependency_group: internet_lexicon
    method_version: llm-shadow-0.1.4
    sources:
      - {title: "Методика Минюста", locator: "с. 22", role: "общая рамка частных языковых признаков", verification: "checked_local_primary"}
