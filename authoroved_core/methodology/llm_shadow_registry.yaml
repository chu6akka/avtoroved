registry:
  id: authoroved-core-llm-shadow
  version: "0.2.0"
  status: experimental_shadow_not_evidentiary
  language: ru
  notice: >-
    Реестр предназначен только для теневой проверки локальной модели. Кандидаты
    не участвуют в сопоставлении и не имеют экспертной или идентификационной
    значимости до отдельной методической и корпусной валидации.
  identification_thresholds: null
  default_suitability_minimum_words: null

features:
  - id: GRA_101
    name_ru: Постскриптумный маркер интернет-коммуникации
    group: Графические особенности интернет-коммуникации
    automation_mode: LLM_ASSISTED
    definition: Явный маркер добавочного сообщения после основной части текста, включая P.S., PS, постскриптум, З.Ы., ЗЫ и контекстно эквивалентные варианты.
    criteria: [дословно присутствующий маркер, функция добавочного сообщения после основной части]
    exclusions: [случайное сочетание букв внутри слова, цитирование обозначения без функции постскриптума]
    unit: кандидат с дословной цитатой
    normalization: не применяется
    minimum_words: 1
    minimum_volume_status: engineering_only
    evidence_method: одна уникальная дословная цитата; координаты вычисляет Python
    dependency_group: internet_graphics
    method_version: llm-shadow-0.1.0
    sources:
      - {title: "Методика Минюста", locator: "с. 22", role: "общий контекст графических особенностей интернет-коммуникации", verification: "checked_local_primary"}

  - id: GRA_102
    name_ru: Переключение клавиатурной раскладки или клавиатурная транслитерация
    group: Графические особенности интернет-коммуникации
    automation_mode: LLM_ASSISTED
    definition: Осмысленная последовательность, набранная в другой клавиатурной раскладке, включая ЗЫ как клавиатурный аналог PS.
    criteria: [дословно присутствующий фрагмент, интерпретация подтверждается соответствием клавиш русской и латинской раскладки]
    exclusions: [обычное иностранное слово, аббревиатура без признака переключения раскладки, латинские P.S. и PS сами по себе — это постскриптумный маркер GRA_101, а не переключение раскладки]
    unit: кандидат с дословной цитатой
    normalization: не применяется
    minimum_words: 1
    minimum_volume_status: engineering_only
    evidence_method: одна уникальная дословная цитата; координаты вычисляет Python
    dependency_group: internet_graphics
    method_version: llm-shadow-0.1.1
    sources:
      - {title: "Методика Минюста", locator: "с. 22", role: "общий контекст графических особенностей интернет-коммуникации", verification: "checked_local_primary"}

  # Фильтр допуска в теневой реестр. Признак включается только при выполнении всех
  # четырёх условий: (1) дословная локализуемость — каждая реализация выражается одной
  # уникальной дословной подстрокой; (2) выигрыш LLM над паттерн-матчингом — решение
  # требует понимания контекста, иначе признак остаётся AUTO; (3) проверяемое
  # исключающее правило — операциональные exclusions, проверяемые экспертом по цитате;
  # (4) границы компетенции — фиксируется наблюдаемый языковой факт, а не характеристика
  # личности.
  #
  # Отклонённые признаки. Причина отказа фиксируется здесь, чтобы признак не был
  # заведён заново без новых оснований.
  #
  # - Эмотивные клише и эмоциональная окраска высказывания: отклонено по условию 4.
  #   Признак описывает приписываемое автору эмоциональное состояние, а не наблюдаемый
  #   языковой факт, и ведёт к суждению о личности.
  #
  # - GRA_103, намеренное фонетическое искажение написания: внесён 16 сентября,
  #   изъят 17 сентября по результатам замера. Отклонено по условиям 1 и 3.
  # - LEX_201, интернет-сленг с контекстно восстанавливаемой функцией: внесён и изъят
  #   тогда же и по тем же условиям.
  #
  #   Основание изъятия. На 12 fixtures оба признака давали 2 из 2 верных
  #   распознаваний. На 40 текстах корпуса Pilot 01, не участвовавших в настройке
  #   формулировок, из 25 кандидатов 21 нарушил собственные исключения признака, а
  #   цитата оказалась длиннее одного слова в 20 случаях из 25. Отклонений валидатора
  #   стало 11 из 80 против 0 из 48 на fixtures.
  #
  #   Причина расхождения: fixtures состояли из одиночных коротких предложений, где
  #   требование процитировать одно слово выполняется принудительно. На документах в
  #   тысячи знаков модель выделяет придаточные и целые предложения, то есть не
  #   локализует реализацию признака. Две итерации ужесточения формулировок сдвинули
  #   число ложных срабатываний с 8 до 6, поэтому дело не в формулировках.
  #
  #   Что нужно для возврата: набор примеров на текстах реальной длины, размеченный
  #   вручную и не использованный при настройке, и механизм, гарантирующий цитату в
  #   одно слово, а не просьба к модели. Подробности — в qwen_shadow_evaluation.md.
