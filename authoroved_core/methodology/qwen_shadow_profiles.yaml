profiles_version: "0.1.4"
profiles:
  - id: overview
    name_ru: Обзорная теневая проверка
    purpose: Найти только явно выраженные кандидаты из экспериментального белого списка.
    instruction: Просмотри текст целиком. Не интерпретируй обычные иностранные слова и аббревиатуры как переключение раскладки без достаточного контекста.
    allowed_feature_ids: [GRA_101, GRA_102, GRA_103, LEX_201]

  - id: internet_communication
    name_ru: Узкая проверка интернет-коммуникации
    purpose: Проверить только постскриптумные и клавиатурно-транслитерированные маркеры.
    instruction: Ищи функцию добавочного сообщения и соответствие клавиш русской и латинской раскладки. Выбирай минимальную уникальную цитату, достаточную для проверки.
    allowed_feature_ids: [GRA_101, GRA_102]

  - id: phonetic_imitation
    name_ru: Узкая проверка фонетических искажений написания
    purpose: Проверить только намеренные отклонения написания в сторону звучащей речи.
    instruction: Ищи написание, которое воспроизводит произношение слова. Не принимай опечатку, нормативную словарную форму, повтор знаков препинания и набор в чужой раскладке. Цитируй одно искажённое слово, а не всё предложение.
    allowed_feature_ids: [GRA_103]

  - id: internet_lexicon
    name_ru: Узкая проверка интернет-сленга
    purpose: Проверить только словоформы, сленговая функция которых восстанавливается из контекста.
    instruction: Для каждой подозрительной формы подставь на её место нормативное словарное значение и посмотри, остаётся ли предложение осмысленным. Если остаётся — это не кандидат. Если получается бессмыслица или несогласованность, а окружение задаёт подтверждение, оценку, усиление или обращение, это кандидат. Не принимай термин предметной области, имя собственное и словарный жаргонизм. Цитируй одно слово, а не всё предложение.
    allowed_feature_ids: [LEX_201]
