profiles_version: "0.1.1"
profiles:
  - id: overview
    name_ru: Обзорная теневая проверка
    purpose: Найти только явно выраженные кандидаты из экспериментального белого списка.
    instruction: Просмотри текст целиком. Не интерпретируй обычные иностранные слова и аббревиатуры как переключение раскладки без достаточного контекста.
    allowed_feature_ids: [GRA_101, GRA_102]

  - id: internet_communication
    name_ru: Узкая проверка интернет-коммуникации
    purpose: Проверить только постскриптумные и клавиатурно-транслитерированные маркеры.
    instruction: Ищи функцию добавочного сообщения и соответствие клавиш русской и латинской раскладки. Выбирай минимальную уникальную цитату, достаточную для проверки.
    allowed_feature_ids: [GRA_101, GRA_102]
