registry:
  id: authoroved-core-russian-grammar
  version: "0.1.1"
  source: "Universal Dependencies / Russian grammar mapping; предметная интерпретация Авторовед Core"

rules:
  - {id: RU_POS_001, level: morphology, name: Имя существительное, description: "Техническая метка NOUN интерпретируется как имя существительное.", mapping_type: DIRECT, conditions: {upos: NOUN}, result: {russian_category: NOUN}, requires_context: false, requires_review: false, source: "UD UPOS NOUN и традиционная русская морфология", implementation: direct_pos, enabled: true}
  - {id: RU_POS_002, level: morphology, name: Имя собственное, description: "PROPN сохраняется как отдельная контекстная категория собственного имени.", mapping_type: CONTEXTUAL, conditions: {upos: PROPN}, result: {russian_category: PROPER_NOUN}, requires_context: true, requires_review: false, source: "UD UPOS PROPN и русская категория собственного имени", implementation: contextual_pos, enabled: true}
  - {id: RU_POS_003, level: morphology, name: Имя прилагательное, description: "ADJ является кандидатом на имя прилагательное; адъективация отдельно не разрешается.", mapping_type: CONTEXTUAL, conditions: {upos: ADJ}, result: {russian_category: ADJECTIVE}, requires_context: true, requires_review: false, source: "UD UPOS ADJ и традиционная русская морфология", implementation: contextual_pos, enabled: true}
  - {id: RU_POS_004, level: morphology, name: Личная форма глагола, description: "VERB с VerbForm=Fin интерпретируется как финитная форма глагола.", mapping_type: DIRECT, conditions: {upos: VERB, features: {VerbForm: Fin}}, result: {russian_category: VERB_FINITE}, requires_context: false, requires_review: false, source: "UD VerbForm=Fin и русская глагольная парадигма", implementation: verb_form, enabled: true}
  - {id: RU_POS_005, level: morphology, name: Инфинитив, description: "VERB с VerbForm=Inf интерпретируется как инфинитив.", mapping_type: DIRECT, conditions: {upos: VERB, features: {VerbForm: Inf}}, result: {russian_category: INFINITIVE}, requires_context: false, requires_review: false, source: "UD VerbForm=Inf и русская глагольная парадигма", implementation: verb_form, enabled: true}
  - {id: RU_POS_006, level: morphology, name: Причастие, description: "VERB с VerbForm=Part интерпретируется как причастие без автоматического разрешения адъективации.", mapping_type: CONTEXTUAL, conditions: {upos: VERB, features: {VerbForm: Part}}, result: {russian_category: PARTICIPLE}, requires_context: true, requires_review: false, source: "UD VerbForm=Part и русская категория причастия", implementation: verb_form, enabled: true}
  - {id: RU_POS_007, level: morphology, name: Деепричастие, description: "VERB с VerbForm=Conv интерпретируется как деепричастие.", mapping_type: DIRECT, conditions: {upos: VERB, features: {VerbForm: Conv}}, result: {russian_category: DEEPRICHASTIE}, requires_context: false, requires_review: false, source: "UD VerbForm=Conv и русская категория деепричастия", implementation: verb_form, enabled: true}
  - {id: RU_POS_008, level: morphology, name: Форма глагола быть во вспомогательной функции, description: "AUX с леммой быть остаётся глагольной формой и получает отдельную функциональную помету.", mapping_type: NON_ISOMORPHIC, conditions: {upos: AUX, lemma: быть}, result: {russian_category: VERB_FINITE, russian_function: "вспомогательная функция"}, requires_context: true, requires_review: false, source: "UD AUX и русское описание аналитических глагольных форм", implementation: aux_be, enabled: true}
  - {id: RU_POS_009, level: morphology, name: Местоимение, description: "PRON интерпретируется как местоимение в субстантивном употреблении.", mapping_type: CONTEXTUAL, conditions: {upos: PRON}, result: {russian_category: PRONOUN, russian_function: "субстантивное употребление"}, requires_context: true, requires_review: false, source: "UD UPOS PRON и русская классификация местоимений", implementation: contextual_pos, enabled: true}
  - {id: RU_POS_010, level: morphology, name: Местоименное слово, description: "DET интерпретируется как местоименное слово в атрибутивном употреблении, а не как отдельная русская часть речи.", mapping_type: NON_ISOMORPHIC, conditions: {upos: DET}, result: {russian_category: PRONOMINAL_WORD, russian_function: "атрибутивное употребление"}, requires_context: true, requires_review: false, source: "UD UPOS DET и русская система местоименных слов", implementation: contextual_pos, enabled: true}
  - {id: RU_POS_011, level: morphology, name: Наречие, description: "ADV интерпретируется как наречие; разграничение с категорией состояния может требовать эксперта.", mapping_type: CONTEXTUAL, conditions: {upos: ADV}, result: {russian_category: ADVERB}, requires_context: true, requires_review: true, source: "UD UPOS ADV и русская категория наречия", implementation: contextual_pos, enabled: true}
  - {id: RU_POS_012, level: morphology, name: Имя числительное, description: "NUM интерпретируется как имя числительное с сохранением контекстной оговорки.", mapping_type: CONTEXTUAL, conditions: {upos: NUM}, result: {russian_category: NUMERAL}, requires_context: true, requires_review: false, source: "UD UPOS NUM и русская категория числительного", implementation: contextual_pos, enabled: true}
  - {id: RU_POS_013, level: morphology, name: Предлог, description: "ADP интерпретируется как предлог.", mapping_type: DIRECT, conditions: {upos: ADP}, result: {russian_category: PREPOSITION}, requires_context: false, requires_review: false, source: "UD UPOS ADP и русская категория предлога", implementation: direct_pos, enabled: true}
  - {id: RU_POS_014, level: morphology, name: Сочинительный союз, description: "CCONJ интерпретируется как сочинительный союз.", mapping_type: DIRECT, conditions: {upos: CCONJ}, result: {russian_category: CONJUNCTION_COORDINATING}, requires_context: false, requires_review: false, source: "UD UPOS CCONJ и русская категория сочинительного союза", implementation: direct_pos, enabled: true}
  - {id: RU_POS_015, level: morphology, name: Подчинительный союз или союзное средство, description: "SCONJ требует контекстного разграничения союза и союзного средства.", mapping_type: CONTEXTUAL, conditions: {upos: SCONJ}, result: {russian_category: CONJUNCTION_SUBORDINATING}, requires_context: true, requires_review: true, source: "UD UPOS SCONJ и русские средства подчинительной связи", implementation: contextual_pos, enabled: true}
  - {id: RU_POS_016, level: morphology, name: Частица, description: "PART интерпретируется как частица с контекстной оговоркой.", mapping_type: CONTEXTUAL, conditions: {upos: PART}, result: {russian_category: PARTICLE}, requires_context: true, requires_review: false, source: "UD UPOS PART и русская категория частицы", implementation: contextual_pos, enabled: true}
  - {id: RU_POS_017, level: morphology, name: Междометие, description: "INTJ интерпретируется как междометие.", mapping_type: DIRECT, conditions: {upos: INTJ}, result: {russian_category: INTERJECTION}, requires_context: false, requires_review: false, source: "UD UPOS INTJ и русская категория междометия", implementation: direct_pos, enabled: true}
  - {id: RU_TECH_001, level: morphology, name: Служебный токен пунктуации, description: "PUNCT сохраняется как технический токен знака препинания и не объявляется частью речи русского языка.", mapping_type: NON_ISOMORPHIC, conditions: {upos: PUNCT}, result: {russian_category: UNKNOWN, russian_function: "знак препинания; служебная машинная единица"}, requires_context: false, requires_review: false, source: "UD UPOS PUNCT; служебное отделение пунктуации от русских частей речи", implementation: direct_pos, enabled: true}
  - {id: RU_TECH_002, level: morphology, name: Служебный токен символа, description: "SYM сохраняется как технический токен символа и не объявляется частью речи русского языка.", mapping_type: NON_ISOMORPHIC, conditions: {upos: SYM}, result: {russian_category: UNKNOWN, russian_function: "символ; служебная машинная единица"}, requires_context: false, requires_review: false, source: "UD UPOS SYM; служебное отделение символов от русских частей речи", implementation: direct_pos, enabled: true}

  - {id: RU_SYN_001, level: syntax, name: Кандидат на подлежащее, description: "nsubj обозначает кандидат на функцию подлежащего.", mapping_type: CONTEXTUAL, conditions: {deprel: nsubj}, result: {russian_function: "кандидат на функцию подлежащего"}, requires_context: true, requires_review: false, source: "UD relation nsubj и русские члены предложения", implementation: syntax_relation, enabled: true}
  - {id: RU_SYN_002, level: syntax, name: Объектный компонент, description: "obj обозначает объектный компонент, который может соответствовать дополнению.", mapping_type: CONTEXTUAL, conditions: {deprel: obj}, result: {russian_function: "объектный компонент; кандидат на дополнение"}, requires_context: true, requires_review: false, source: "UD relation obj и русские члены предложения", implementation: syntax_relation, enabled: true}
  - {id: RU_SYN_003, level: syntax, name: Косвенный объект, description: "iobj обозначает косвенный объект, который может соответствовать дополнению.", mapping_type: CONTEXTUAL, conditions: {deprel: iobj}, result: {russian_function: "косвенный объект; кандидат на дополнение"}, requires_context: true, requires_review: false, source: "UD relation iobj и русские члены предложения", implementation: syntax_relation, enabled: true}
  - {id: RU_SYN_004, level: syntax, name: Согласованное определение, description: "amod интерпретируется как согласованное определение при сохранении контекстной проверки.", mapping_type: CONTEXTUAL, conditions: {deprel: amod}, result: {russian_function: "согласованное определение"}, requires_context: true, requires_review: false, source: "UD relation amod и русские члены предложения", implementation: syntax_relation, enabled: true}
  - {id: RU_SYN_005, level: syntax, name: Именной распространитель, description: "nmod не отождествляется автоматически с несогласованным определением.", mapping_type: NON_ISOMORPHIC, conditions: {deprel: nmod}, result: {russian_function: "именной распространитель"}, requires_context: true, requires_review: true, source: "UD relation nmod и русские синтаксические функции", implementation: syntax_relation, enabled: true}
  - {id: RU_SYN_006, level: syntax, name: Обстоятельственный распространитель, description: "advmod обозначает обстоятельственный распространитель без автоматического семантического типа.", mapping_type: CONTEXTUAL, conditions: {deprel: advmod}, result: {russian_function: "обстоятельственный распространитель"}, requires_context: true, requires_review: false, source: "UD relation advmod и русские обстоятельственные отношения", implementation: syntax_relation, enabled: true}
  - {id: RU_SYN_007, level: syntax, name: Определительная придаточная конструкция, description: "acl:relcl является кандидатом на определительную придаточную конструкцию.", mapping_type: CONTEXTUAL, conditions: {deprel: "acl:relcl"}, result: {russian_function: "кандидат на определительную придаточную конструкцию", construction: RELATIVE_CLAUSE}, requires_context: true, requires_review: false, source: "UD relation acl:relcl и русские определительные придаточные", implementation: syntax_relation, enabled: true}
  - {id: RU_SYN_008, level: syntax, name: Причастная конструкция при имени, description: "acl вместе с причастной формой и зависимыми компонентами образует кандидат причастной конструкции.", mapping_type: CONTEXTUAL, conditions: {deprel: acl, features: {VerbForm: Part}}, result: {russian_function: "причастная форма при имени", construction: PARTICIPIAL_CONSTRUCTION}, requires_context: true, requires_review: false, source: "UD acl + VerbForm=Part и русские причастные конструкции", implementation: participial_construction, enabled: true}
  - {id: RU_SYN_009, level: syntax, name: Деепричастная конструкция, description: "advcl вместе с деепричастной формой образует кандидат деепричастной конструкции.", mapping_type: CONTEXTUAL, conditions: {deprel: advcl, features: {VerbForm: Conv}}, result: {russian_function: "деепричастная конструкция", construction: GERUND_CONSTRUCTION}, requires_context: true, requires_review: false, source: "UD advcl + VerbForm=Conv и русские деепричастные конструкции", implementation: gerund_construction, enabled: true}
  - {id: RU_SYN_010, level: syntax, name: Обстоятельственная предикативная конструкция, description: "advcl с финитной формой не считается деепричастной конструкцией.", mapping_type: CONTEXTUAL, conditions: {deprel: advcl, features: {VerbForm: Fin}}, result: {russian_function: "обстоятельственная предикативная или придаточная конструкция", construction: SUBORDINATE_CLAUSE}, requires_context: true, requires_review: true, source: "UD advcl + VerbForm=Fin и русские придаточные конструкции", implementation: finite_advcl, enabled: true}
  - {id: RU_SYN_011, level: syntax, name: Сочинительная связь, description: "conj требует разграничения однородных компонентов и предикативных частей.", mapping_type: NON_ISOMORPHIC, conditions: {deprel: conj}, result: {russian_function: "сочинительная связь"}, requires_context: true, requires_review: false, source: "UD relation conj и русские координационные конструкции", implementation: coordination, enabled: true}
  - {id: RU_SYN_012, level: syntax, name: Средство сочинительной связи, description: "cc обозначает средство сочинительной связи.", mapping_type: CONTEXTUAL, conditions: {deprel: cc}, result: {russian_function: "средство сочинительной связи"}, requires_context: true, requires_review: false, source: "UD relation cc и русские средства сочинительной связи", implementation: syntax_relation, enabled: true}
  - {id: RU_SYN_013, level: syntax, name: Средство подчинительной связи, description: "mark обозначает средство подчинительной связи.", mapping_type: CONTEXTUAL, conditions: {deprel: mark}, result: {russian_function: "средство подчинительной связи"}, requires_context: true, requires_review: false, source: "UD relation mark и русские средства подчинительной связи", implementation: syntax_relation, enabled: true}
  - {id: RU_SYN_014, level: syntax, name: Связочный компонент, description: "cop обозначает связочный компонент предикативной конструкции.", mapping_type: CONTEXTUAL, conditions: {deprel: cop}, result: {russian_function: "связочный компонент предикативной конструкции"}, requires_context: true, requires_review: false, source: "UD relation cop и русская предикативная конструкция", implementation: syntax_relation, enabled: true}
  - {id: RU_SYN_015, level: syntax, name: Соположенная конструкция, description: "parataxis не разрешается автоматически как бессоюзная, присоединительная или парцеллированная конструкция.", mapping_type: NON_ISOMORPHIC, conditions: {deprel: parataxis}, result: {russian_function: "кандидат на бессоюзную, присоединительную или парцеллированную конструкцию", construction: UNKNOWN}, requires_context: true, requires_review: true, source: "UD relation parataxis и русские способы связи", implementation: ambiguous_syntax, enabled: true}
  - {id: RU_SYN_016, level: syntax, name: Эллиптическая конструкция, description: "orphan является кандидатом на эллиптическую конструкцию и требует проверки.", mapping_type: NON_ISOMORPHIC, conditions: {deprel: orphan}, result: {russian_function: "кандидат на эллиптическую конструкцию", construction: ELLIPTICAL_CONSTRUCTION}, requires_context: true, requires_review: true, source: "UD relation orphan и русские эллиптические конструкции", implementation: ambiguous_syntax, enabled: true}
  - {id: RU_SYN_017, level: syntax, name: Приложение, description: "appos интерпретируется как кандидат на приложение или аппозитивную конструкцию.", mapping_type: CONTEXTUAL, conditions: {deprel: appos}, result: {russian_function: "приложение или аппозитивная конструкция", construction: APPOSITIVE_CONSTRUCTION}, requires_context: true, requires_review: false, source: "UD relation appos и русская аппозиция", implementation: syntax_relation, enabled: true}
  - {id: RU_SYN_018, level: syntax, name: Обращение, description: "vocative интерпретируется как обращение.", mapping_type: DIRECT, conditions: {deprel: vocative}, result: {russian_function: "обращение", construction: VOCATIVE_CONSTRUCTION}, requires_context: false, requires_review: false, source: "UD relation vocative и русская категория обращения", implementation: syntax_relation, enabled: true}
