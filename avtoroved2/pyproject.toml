[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aved"
version = "0.1.0"
description = "Автороведческая идентификация по методике Рубцовой и др. (ЭКЦ МВД, 2007)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "razdel>=0.5.0",
    "natasha>=1.6.0",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "ollama>=0.6",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6"]
online = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
aved-gui = "aved.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aved*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
